<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">

<style>
:root{--bg:#121212;--card:#1b1b1b;--line:#2e2e2e;--azul:#1e3a70;--lar:#f26b2e;--txt:#f2f2f2;--mut:#9a9a9a;--in:#0e0e0e;--ok:#4cc38a;--ruim:#ff5a5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,"Segoe UI",Arial,sans-serif}
header{background:var(--azul);border-bottom:4px solid #b4430f;text-align:center;padding:22px 12px;color:#fff}

h1{margin:14px 0 6px;font-size:22px;letter-spacing:1px}.pill{display:inline-block;background:#ffffff22;border-radius:20px;padding:4px 14px;font-size:12px}
main{max-width:1040px;margin:0 auto;padding:18px 14px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px 10px;text-align:center;cursor:pointer;font:inherit;color:inherit;font-weight:700}

button.p{background:var(--lar);border-color:var(--lar);color:#fff;font-weight:700}
.tags span{font-size:12px;border-radius:20px;padding:3px 10px;margin-left:6px;background:var(--card);border:1px solid var(--line)}
.tabs{display:flex;gap:4px;border-bottom:2px solid var(--lar);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 18px;border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;background:var(--card);cursor:pointer;color:var(--mut);white-space:nowrap}
.tab.on{background:var(--lar);color:#fff;border-color:var(--lar);font-weight:700}
.box{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse}th{background:#5a3b17;color:#fff;text-align:left;padding:7px;white-space:nowrap}td{padding:7px;border-bottom:1px solid var(--line)}
.r{text-align:right}.ap{color:var(--ruim)}.pg{color:var(--ok)}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}label{font-size:11px;font-weight:700;display:flex;flex-direction:column;gap:3px}
input,select{background:var(--in);color:var(--txt);border:1px solid var(--line);border-radius:5px;padding:7px;font:inherit}
.kp{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.k{flex:1;min-width:140px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px}.k small{color:var(--mut);display:block}.k b{font-size:18px}
.bx{height:12px;background:var(--lar);border-radius:2px}
.dre td.t{font-weight:700;background:#ffffff0d}.dre td.s{padding-left:22px;color:var(--mut)}
.em{color:var(--lar)}.chip{background:var(--in);border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:12px}td small{display:block;color:var(--mut);font-size:10px}
.c2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:800px){.c2{grid-template-columns:1fr}}.don{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;flex:none}.don span{background:var(--card);width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-weight:700;text-align:center;line-height:1.1}.don small{display:block;font-size:10px;color:var(--mut)}.cols{display:flex;gap:10px;align-items:flex-end;height:130px;margin-top:8px}.col{flex:1;text-align:center;display:flex;flex-direction:column;justify-content:flex-end}.col small{color:var(--mut)}tr.ok td{background:#4cc38a22}tr.sel td{background:#f26b2e44}tr[data-xs],tr[data-xl]{cursor:pointer}
.filt{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.filt label{font-weight:600}select.pg{color:var(--ok)}select.ap{color:var(--ruim)}select.em{color:var(--lar)}
.tr summary{display:flex;justify-content:space-between;gap:12px;cursor:pointer;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700}.tr details details>summary{font-weight:600}.tr details details details>summary{font-weight:400}.ind{margin-left:20px}.lf{display:flex;justify-content:space-between;padding:5px 8px;border-bottom:1px solid var(--line);color:var(--mut)}.hd{display:flex;justify-content:space-between;background:#44546a;color:#fff;padding:7px 8px;font-weight:700}.hd.tot{margin-top:6px}
.xl{padding:0;overflow:auto;max-height:68vh}.xl table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.xl th{position:sticky;top:0;z-index:2;background:#c8601a;color:#fff;white-space:nowrap;border:1px solid #9a4710;padding:7px 16px;cursor:pointer;user-select:none;text-align:left}.xl th.r{text-align:right}
.xl td{white-space:nowrap;border:1px solid var(--line);padding:5px 16px}.xl td small{display:inline;margin-left:10px}.xl td.n{color:var(--mut);text-align:center;background:#ffffff0a}
.xl tr:nth-child(even) td{background:#ffffff06}.xl tr.sel td{background:#f26b2e33}.xl tr.tt td{position:sticky;bottom:0;background:#44546a;color:#fff;font-weight:700}
footer{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--line);font-size:12px;color:var(--mut);padding:5px 12px;display:flex;justify-content:space-between}

/* ===== visual ERP (menu + barra de botões + planilha) ===== */
:root{--bg:#e9edf2;--card:#fff;--line:#c9d1dc;--txt:#1b2430;--mut:#5d6b7c;--in:#fff;--azul:#1f4e8c;--ok:#1b8a5a;--ruim:#c62828}

body{font:13px/1.35 'Segoe UI',Tahoma,Arial,sans-serif}
header{display:none}main{max-width:none;padding:12px 16px 40px}
#erp{position:sticky;top:0;z-index:50}
.titlebar{background:linear-gradient(#24508f,#173a6b);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:5px 12px;font-weight:600}
.titlebar .lg{display:flex;align-items:center;gap:8px;letter-spacing:.5px}.titlebar .lg i{width:22px;height:20px;background:linear-gradient(var(--lar) 0 30%,#fff 30% 62%,var(--lar) 62%);border-radius:2px}.titlebar small{font-weight:400;opacity:.85}
.mbar{display:flex;flex-wrap:wrap;background:#f2f4f7;border-bottom:1px solid #c9d1dc;padding:0 6px;color:#1b2430}
.mbar>div{position:relative;padding:5px 12px;cursor:default}.mbar>div:hover{background:#dbe6f5}
.mbar .dd{display:none;position:absolute;left:0;top:100%;min-width:210px;background:#fff;border:1px solid #b9c4d2;box-shadow:2px 3px 8px #0003;z-index:60}.mbar>div:hover .dd{display:block}
.dd a{display:block;padding:6px 14px;cursor:pointer;color:#1b2430;white-space:nowrap}.dd a:hover{background:#2f6bb8;color:#fff}
.tbar{display:flex;gap:2px;flex-wrap:wrap;align-items:center;background:linear-gradient(#fbfcfd,#e4e8ee);border-bottom:1px solid #c9d1dc;padding:3px 6px}
.tbar button{background:none;border:1px solid transparent;border-radius:3px;padding:3px 9px;font:11px 'Segoe UI',Tahoma;color:#1b2430;cursor:pointer;display:flex;flex-direction:column;align-items:center;min-width:54px}
.tbar button span{font-size:19px;line-height:1.15}.tbar button:hover{background:#dbe6f5;border-color:#9db8dc}.tbar hr{width:1px;height:34px;border:0;background:#c3cbd6;margin:0 5px}
th{background:#27497e!important;color:#fff}
.xl th{background:#27497e!important;border-color:#1d3a66!important}
.xl tr:nth-child(even) td{background:#00000008!important}.xl td.n{background:#0000000d!important}.xl tr.sel td{background:#ffe3cf!important}
:root[data-theme="dark"] .xl tr.sel td{background:#4a3320!important}:root[data-theme="dark"] .xl tr:nth-child(even) td{background:#ffffff08!important}
.dre td.t{background:#0000000a}
.card{border-radius:6px;box-shadow:0 1px 2px #0002}.card:hover{border-color:var(--azul);box-shadow:0 2px 6px #0003}
.tab.on{background:var(--azul);border-color:var(--azul)}.tabs{border-bottom-color:var(--azul)}
.box,.k{border-radius:4px}footer{background:#e4e8ee;color:#1b2430;border-top:1px solid #c9d1dc}
h3.mod{margin:0 0 12px;color:var(--azul)}
</style></head><body>
<header><div class="logo"><i></i>COMPANY</div><h1>PAINEL DE LANÇAMENTOS</h1><span class="pill">Protótipo — dados de exemplo</span></header>

<script>

{id:'Financeiro Custeio',ico:'💼',cor:'#f26b2e',c:['Centro de custo','Obra'],dre:'Custeio de obra',d:['Alojamento','Alimentação','Aluguel de casa'],f:['IMOBILIÁRIA CENTRAL','RESTAURANTE DO ZÉ']},
{id:'Financeiro',ico:'💼',cor:'#f26b2e',c:['Conta','Categoria'],dre:'Despesas financeiras',d:['Tarifa bancária','Juros','Seguro'],f:['BANCO','SEGURADORA']},
{id:'Diretoria',ico:'👔',cor:'#1e3a70',c:['Responsável','Categoria'],dre:'Despesas administrativas',d:['Contabilidade','Jurídico','Consultoria'],f:['ESCRITÓRIO CONTÁBIL','LAW FIRM']},
{id:'SMT',nome:'SMT - Segurança do Trabalho',ico:'🦺',cor:'#f26b2e',c:['Colaborador','Tipo'],dre:'Despesas com segurança do trabalho',d:['Exame periódico','Treinamento','Curso de qualificação'],f:['CLÍNICA OCUPACIONAL','CENTRO DE TREINAMENTO']}];

c1:s.id==='Frotas'?['AAA-0A00','BBB-1B11','CCC-2C22'][Math.floor(rnd()*3)]:'—',c2:'—',fav:s.f[Math.floor(rnd()*s.f.length)],

L.forEach(x=>{const r=rnd(),[ob,em]=x.setor==='Frotas'&&r>.8?OBS[6]:pick(OBS),g=REGRA(ob);x.obra=ob;x.empresa=EMP[em];x.obraN=g.obra;x.tipo=g.escolhe&&rnd()>.5?'Operacional':g.tipo;

if(g.vinc==='adm')x.equipe=g.obra;else if(g.vinc==='placa'){x.placa=x.placa||pick(PL);x.equipe='PLACA '+x.placa}else if(g.vinc==='pessoa')x.equipe=pick(['JOELSON','OBRIGAÇÕES BANCÁRIAS']);else x.equipe=ob.startsWith('SUP')?pick(['SUPERVISOR 2','SUPERVISOR 1']):pick(['FXGO-01','PDGO-01','RCGO-02']);x.usuario=USR[x.setor]});

function home(){st.u=null;$('#rod').textContent='Pronto...';
$('#app').innerHTML=`<h3 class='mod'>Selecione o módulo de lançamento</h3><div class="grid">${SET.map(s=>`<button class="card" data-e="${s.id}"><div class="ico" style="background:${s.cor}">${s.ico}</div>${s.nome||s.id}</button>`).join('')}</div>
<p class="nota">Clique em um setor para simular a entrada (o login real será ligado depois). Financeiro e Diretoria enxergam todos os setores.</p>`;}

<div class="tabs">${T.map(t=>`<div class="tab ${t===st.tab?'on':''}" data-t="${t}">${t}</div>`).join('')}</div><div id="v"></div>`;
({'Lançamentos':lanc,'Resumo':resumo,'Cadastros':cad,'Conciliação':conc,'Relatório':rel,'DRE':dre,'Por setor':porSetor})[st.tab]();}
